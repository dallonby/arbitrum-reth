# Alloy
alloy-primitives = { version = "=1.6.0", default-features = false, features = ["map-foldhash"] }
alloy-consensus = { version = "=2.1.0", default-features = false }
alloy-eips = { version = "=2.1.0", default-features = false }
alloy-evm = { version = "=0.37.0", features = ["rpc"] }
alloy-rpc-types-eth = { version = "=2.1.0" }
alloy-genesis = { version = "=2.1.0" }
alloy-network = { version = "=2.1.0" }
alloy-rlp = { version = "=0.3.15", features = ["derive"] }
alloy-rpc-types = { version = "=2.1.0" }
alloy-rpc-types-engine = { version = "=2.1.0" }
alloy-rpc-types-trace = { version = "=2.1.0" }
alloy-serde = { version = "=2.1.0" }
alloy-sol-types = { version = "=1.6.0" }
alloy-trie = { version = "0.9.4" }
alloy-hardforks = { version = "0.4.7" }

# Revm
revm = { version = "=41.0.0", features = [
    "optional_balance_check",
    "optional_eip3541",
    "optional_eip3607",
    "optional_priority_fee_check",
    "optional_eip7623",
    "optional_no_base_fee",
] }
revm-database = { version = "=41.0.0" }
revm-database-interface = { version = "=41.0.0" }
revm-state = { version = "=41.0.0" }
revm-primitives = { version = "=41.0.0" }
revm-interpreter = { version = "=41.0.0" }
revm-context = { version = "=41.0.0" }
revm-bytecode = { version = "=41.0.0" }

# Arb-alloy
arb-alloy-consensus = "0.1.2"
arb-alloy-predeploys = "0.1.2"
arb-alloy-util = "0.1.2"

# Common
crossbeam-channel = "0.5"
futures = "0.3"
c-kzg = "2.1.7"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
once_cell = "1.21"
rustc-hash = "2.1"
rayon = "1.11"
clap = { version = "4", features = ["derive"] }
async-trait = "0.1.68"
eyre = "0.6"
anyhow = "1"
derive_more = { version = "2", features = ["full"] }
auto_impl = "1"
bytes = "1"
bincode = "1.3"
parking_lot = "0.12"
lazy_static = "1"
num = "0.4"
hex = "0.4"
cc = "1"
sha2 = "0.11"
base64 = "0.22"
jsonrpsee = { version = "0.26.0", features = ["macros", "server"] }
jsonrpsee-types = "0.26.0"
jsonrpsee-http-client = "0.26.0"
dyn-clone = "1"
brotli = { version = "8", default-features = false, features = ["std"] }
wasmer = { git = "https://github.com/OffchainLabs/wasmer.git", rev = "5e7d8fd287436b01fa52d8dbcc9674b3cc7a66ca", default-features = false, features = ["sys", "cranelift"] }
schnellru = "0.2"

nitro-prover = { package = "prover", git = "https://github.com/OffchainLabs/nitro.git", rev = "b1cf6db81afbc1f67c898ac9add5d37391ebd87b", default-features = false }
nitro-arbutil = { package = "arbutil", git = "https://github.com/OffchainLabs/nitro.git", rev = "b1cf6db81afbc1f67c898ac9add5d37391ebd87b" }

# Transitive deps for Nitro crates
tiny-keccak = { version = "2.0.2", features = ["keccak"] }
wasmparser = "0.121"
ruint2 = "1.9.0"

# Test deps
rstest = "0.26"
proptest = "1"

[workspace.lints.rust]
unused_must_use = "deny"

[workspace.lints.rustdoc]
broken_intra_doc_links = "allow"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"

# Structural complexity — acceptable for this codebase
too_many_arguments = "allow"
type_complexity = "allow"
result_unit_err = "allow"
new_without_default = "allow"

[profile.dev]
debug = 0

[profile.test]
debug = 0

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"

[profile.maxperf]
inherits = "release"
lto = "fat"

[profile.fastdev]
inherits = "release"
lto = false
codegen-units = 256
incremental = true
